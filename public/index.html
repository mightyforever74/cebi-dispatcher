<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      D1 "Tema Köprüsü" (docs/UI_D1_REPORT.md, Adım 1.1):
      FOUC (flash-of-unstyled-content / yanlış-tema-parlaması) önleyici.
      İlk boyamadan ÖNCE `data-theme` ve `color-scheme` atanır; böylece
      global.css'teki `[data-theme="dark"]` / `[data-theme="light"]` CSS
      Custom Property blokları ilk paint'te doğru değerlerle hazır olur.
      Anahtar `tf.theme`, src/context/index.tsx (THEME_STORAGE_KEY) ve
      src/examples/Configurator/index.tsx ile BİREBİR aynı tutulmalıdır.
    -->
    <script>
      (function () {
        var KEY = "tf.theme";
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem(KEY);
          if (stored === "dark" || stored === "light") {
            theme = stored;
          } else if (window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "light";
          }
        } catch (e) {
          // localStorage erişilemez (gizli sekme/kota) — varsayılan "dark" kalır.
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A73E8" />
    <link rel="apple-touch-icon" sizes="76x76" href="%PUBLIC_URL%/apple-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TulipFleet — Fleet Command Center</title>
    <!--
      D7 (docs/UI_D7_FONTS_REPORT.md): fontlar self-host. Google Fonts kaldirildi;
      @font-face tanimlari asagida inline <style>, dosyalar public/fonts/
      (kaynak: @fontsource-variable/space-grotesk, @fontsource-variable/manrope,
      @fontsource/material-icons-round v5.3.0, OFL/Apache-2.0). Preload yalnizca
      ilk boyamada kesin kullanilan uc dosya; latin-ext unicode-range ile gerektiginde iner.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%PUBLIC_URL%/fonts/manrope-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%PUBLIC_URL%/fonts/space-grotesk-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%PUBLIC_URL%/fonts/material-icons-round-latin-400-normal.woff2" />
    <!--
      @font-face tanimlari burada INLINE: webpack/css-loader kok-goreli url(/fonts/..)'u
      modul olarak cozmeye calisir; public/ dosyalari icin tek guvenli yer HTML.
      Ek istek yok; preload ile ayni belge. Ikon fontu font-display: block (ligatur metni gorunmez).
    -->
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-display: swap;
        font-weight: 300 700;
        src: url("/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }

      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-display: swap;
        font-weight: 300 700;
        src: url("/fonts/space-grotesk-latin-ext-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }

      @font-face {

        font-style: normal;
        font-display: swap;
        font-weight: 300 700;
        src: url("/fonts/manrope-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }

      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-display: swap;
        font-weight: 300 700;
        src: url("/fonts/manrope-latin-ext-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }

      @font-face {
        font-family: "Material Icons Round";
        font-style: normal;
        font-display: block;
        font-weight: 400;
        src: url("/fonts/material-icons-round-latin-400-normal.woff2") format("woff2");
      }

      /* Google Fonts CSS'inin sagladigi sinif (MUI <Icon baseClassName="material-icons-round">).
         .material-icons de ayni aileye baglanir: tema disi/erken render'da yalnizca Round var. */
      .material-icons,
      .material-icons-round {
        font-family: "Material Icons Round";
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>

  </head>
